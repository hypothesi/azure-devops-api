name: publish

# Publishes to npm with trusted publishing (OIDC), so the repo stores no npm token.
# Configure the trusted publisher for this repo and workflow on npmjs.com first.

on:
   release:
      types:
         - published

permissions:
   contents: read

jobs:
   publish:
      runs-on: ubuntu-latest
      timeout-minutes: 15
      environment: npm
      permissions:
         contents: read
         id-token: write
      steps:
         - name: Check out repo
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         - name: Set up Vite+
           uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
           with:
              node-version-file: .node-version
              run-install: true

         - name: Check that the tag matches package.json
           env:
              TAG: ${{ github.event.release.tag_name }}
           run: |
              version="v$(node -p "require('./package.json').version")"
              if [ "$TAG" != "$version" ]; then
                 echo "Release tag $TAG does not match package.json version $version" >&2
                 exit 1
              fi

         - name: Format, lint, type check, build, and check package exports
           run: npm run standards

         - name: Test in Node.js
           run: npm run test:node

         - name: Publish
           run: npm publish --access public
