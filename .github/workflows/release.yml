name: release

# On every push to main, changesets/action opens or updates a "chore: version packages" pull
# request from the files in .changeset/. Merging that pull request runs this workflow again,
# and with no changesets left it publishes every package whose version is not on npm yet.
# Publishing uses npm trusted publishing (OIDC). Configure a trusted publisher for both
# packages on npmjs.com, for this repository and this workflow file, before the first release.

on:
   push:
      branches:
         - main
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   release:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      environment: npm
      permissions:
         contents: write
         pull-requests: write
         id-token: write
      steps:
         - name: Check out repo
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Set up Vite+
           uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
           with:
              node-version-file: .node-version
              run-install: true

         - name: Open the version pull request or publish
           uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
           with:
              version-script: npm run version-packages
              publish-script: npm run release
              commit-message: 'chore: version packages'
              pr-title: 'chore: version packages'
           env:
              NPM_CONFIG_PROVENANCE: 'true'
