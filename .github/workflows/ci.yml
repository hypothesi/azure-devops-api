name: ci

on:
   pull_request:
   push:
      branches:
         - main
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   standards:
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
         - name: Check out repo
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         - name: Set up Vite+
           uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
           with:
              node-version-file: .node-version
              cache: true
              run-install: true

         - name: Generate, format, lint, type check, build, and check package exports
           run: npm run standards

   test:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            node-version: ['22', '24']
      steps:
         - name: Check out repo
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         - name: Set up Vite+
           uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
           with:
              node-version: ${{ matrix.node-version }}
              cache: true
              run-install: true

         - name: Cache Playwright browsers
           id: playwright-cache
           uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

         - name: Install Playwright browsers
           if: steps.playwright-cache.outputs.cache-hit != 'true'
           run: npx playwright install --with-deps chromium

         - name: Install Playwright system dependencies
           if: steps.playwright-cache.outputs.cache-hit == 'true'
           run: npx playwright install-deps chromium

         - name: Generate the client and test in Node.js and Chromium
           run: npm test
